<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Data | Inixindo Cashflow Intelligence</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f8fafc;
            color: #344154;
            font-family: "Segoe UI", sans-serif;
        }
        .settings-shell {
            width: min(900px, 94vw);
            margin: 34px auto;
            background: #ffffff;
            border-radius: 18px;
            border-top: 6px solid #CC0000;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
            padding: 30px;
        }
        .settings-header {
            display: flex;
            justify-content: space-between;
            gap: 18px;
            align-items: flex-start;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 20px;
            margin-bottom: 22px;
        }
        h1 {
            margin: 0 0 10px 0;
            color: #243247;
            font-size: 1.85rem;
            line-height: 1.15;
        }
        .sub {
            margin: 0;
            color: #64748b;
            line-height: 1.55;
            font-size: 1rem;
            max-width: 680px;
        }
        .nav-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 0 0 auto;
        }
        .nav-link,
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 0.98rem;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
        }
        .nav-link {
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            color: #475569;
            background: #ffffff;
        }
        .nav-link:hover {
            border-color: #CC0000;
            color: #991b1b;
            background: #fff7f7;
        }
        .status-panel {
            margin: 0;
            padding: 18px 20px;
            border-radius: 12px;
            border: 1px solid #dbe4ef;
            background: #f8fafc;
            line-height: 1.6;
        }
        .status-panel strong {
            color: #243247;
        }
        .status-panel ul {
            margin: 10px 0 0 20px;
            padding: 0;
        }
        .status-active {
            color: #0f766e;
        }
        .status-inactive {
            color: #b45309;
        }
        .action-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 14px;
            margin-top: 18px;
        }
        button {
            width: 100%;
            min-height: 52px;
            border: none;
            background: #CC0000;
            color: #ffffff;
        }
        button:hover {
            background: #990000;
        }
        button.secondary {
            background: #ffffff;
            color: #475569;
            border: 1px solid #cbd5e1;
        }
        button.secondary:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }
        button.secondary:disabled {
            background: #f1f5f9;
            color: #94a3b8;
            border-color: #cbd5e1;
        }
        button:disabled {
            background: #94a3b8;
            border-color: #94a3b8;
            cursor: not-allowed;
        }
        .message {
            display: none;
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #1e3a8a;
            line-height: 1.5;
        }
        .message.active {
            display: block;
        }
        .message.success {
            border-color: #bbf7d0;
            background: #f0fdf4;
            color: #166534;
        }
        .message.error {
            border-color: #fecaca;
            background: #fef2f2;
            color: #991b1b;
        }
        .hidden {
            display: none;
        }
        @media (max-width: 780px) {
            .settings-shell {
                padding: 24px;
                margin: 20px auto;
            }
            .settings-header,
            .action-row {
                grid-template-columns: 1fr;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main class="settings-shell">
        <header class="settings-header">
            <div>
                <h1>Internal API / APIDog</h1>
                <p class="sub">Konfigurasi API dikelola dari environment VPS. Halaman ini hanya menampilkan status koneksi dan memberi akses refresh dataset agar data internal tetap terbaru tanpa mengubah kredensial dari browser.</p>
            </div>
            <nav class="nav-actions" aria-label="Navigasi">
                <a class="nav-link" href="{{ url_for('home') }}">Kembali ke Dashboard</a>
                <a class="nav-link" href="{{ url_for('logout') }}" onclick="event.preventDefault(); document.getElementById('logout-form').submit();">Keluar</a>
            </nav>
        </header>

        <form id="logout-form" class="hidden" method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        </form>

        <section id="settings-status" class="status-panel">Memuat status konfigurasi...</section>

        <div class="action-row">
            <button type="button" id="btn-refresh-internal-api" class="secondary">Muat Ulang Data Sekarang</button>
            <button type="button" id="btn-save" disabled>Internal API Sudah Aktif</button>
        </div>
        <div id="settings-message" class="message" role="status" aria-live="polite"></div>
    </main>

    <script>
        // Global Fetch Interceptor for CSRF Protection
        (function() {
            const originalFetch = window.fetch;
            window.fetch = function(url, options = {}) {
                if (options.method && options.method.toUpperCase() === 'POST') {
                    options.headers = options.headers || {};
                    const token = document.cookie.match(/csrf_token=([^;]+)/)?.[1] || '';
                    if (token) {
                        if (options.headers instanceof Headers) {
                            options.headers.set('X-CSRFToken', token);
                        } else if (Array.isArray(options.headers)) {
                            options.headers.push(['X-CSRFToken', token]);
                        } else {
                            options.headers['X-CSRFToken'] = token;
                        }
                    }
                }
                return originalFetch(url, options);
            };
        })();

        const ui = {
            status: document.getElementById('settings-status'),
            message: document.getElementById('settings-message'),
            btnRefreshInternalApi: document.getElementById('btn-refresh-internal-api'),
            btnSave: document.getElementById('btn-save'),
        };

        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function fetchJson(url, options = {}) {
            const response = await fetch(url, options);
            const text = await response.text();
            const data = text ? JSON.parse(text) : {};
            if (response.status === 401) {
                window.location.href = (data && data.loginUrl) || '/login';
                throw new Error('Autentikasi diperlukan.');
            }
            if (!response.ok) {
                throw new Error(data.error || data.message || `Request failed: ${response.status}`);
            }
            return data;
        }

        function renderMessage(payload, variant = 'active') {
            ui.message.className = `message active ${variant}`;
            ui.message.innerHTML = `
                <strong>${escapeHtml(payload.message || '-')}</strong>
                <div>${Number(payload.recordCount || 0).toLocaleString('id-ID')} record aktif.</div>
            `;
        }

        function setInternalApiConnectionState(config) {
            const source = config && config.syncStatus && config.syncStatus.financialData ? config.syncStatus.financialData : {};
            const activeSource = source.activeSource || {};
            const apiProfile = Array.isArray(source.availableSources)
                ? source.availableSources.find(item => item && item.type === 'json_api' && item.configured)
                : null;
            const apiConnected = Boolean(apiProfile);
            const apiActive = activeSource.type === 'json_api' || source.dataMode === 'production';
            const refreshing = source.syncStatus === 'refreshing';
            ui.btnSave.disabled = true;
            ui.btnSave.textContent = apiConnected || apiActive ? 'Internal API Sudah Aktif' : 'Internal API Belum Aktif';
            ui.btnRefreshInternalApi.disabled = !(apiConnected || apiActive) || refreshing;
            ui.btnRefreshInternalApi.textContent = refreshing ? 'Pemuatan Ulang Berjalan...' : 'Muat Ulang Data Sekarang';
        }

        function renderStatus(config) {
            const source = config && config.syncStatus && config.syncStatus.financialData ? config.syncStatus.financialData : {};
            const issues = (source.sourceRegistryIssues || []).map(issue => `<li>${escapeHtml(issue)}</li>`).join('');
            const activeSource = source.activeSource || {};
            const apiProfile = Array.isArray(source.availableSources)
                ? source.availableSources.find(item => item && item.type === 'json_api')
                : null;
            const apiConfigured = Boolean(apiProfile && apiProfile.configured);
            const apiActive = activeSource.type === 'json_api' || source.dataMode === 'production';
            const connectionClass = apiConfigured || apiActive ? 'status-active' : 'status-inactive';
            const connectionLabel = apiActive
                ? 'Aktif memakai Internal API/APIDog'
                : (apiConfigured ? 'Internal API sudah terhubung di konfigurasi server' : 'Belum memakai Internal API/APIDog');
            const refreshHint = apiConfigured || apiActive
                ? 'Dataset dapat di-refresh tanpa menyimpan ulang kredensial.'
                : 'Hubungi IT untuk mengaktifkan konfigurasi Internal API di VPS.';
            ui.status.innerHTML = `
                <div>Connection: <strong class="${connectionClass}">${escapeHtml(connectionLabel)}</strong></div>
                <div>Active data source: <strong>${escapeHtml(activeSource.name || source.activeSourceKey || 'Demo Lokal')}</strong></div>
                <div>Status kontrak: <strong>${source.contractReady ? 'siap' : 'perlu dicek'}</strong></div>
                <div>Record aktif: <strong>${Number(source.recordCount || 0).toLocaleString('id-ID')}</strong></div>
                <div>Status data: <strong>${escapeHtml(source.syncStatus || '-')}</strong></div>
                <div>Refresh: <strong>${escapeHtml(refreshHint)}</strong></div>
                ${issues ? `<ul>${issues}</ul>` : ''}
            `;
            setInternalApiConnectionState(config);
        }

        async function loadStatus() {
            const config = await fetchJson('/get-config');
            renderStatus(config);
            return config;
        }

        async function refreshInternalApiDataset() {
            ui.btnRefreshInternalApi.disabled = true;
            ui.btnRefreshInternalApi.textContent = 'Me-refresh...';
            ui.message.className = 'message active';
            ui.message.innerHTML = '<strong>Mengambil ulang dataset dari Internal API...</strong>';
            try {
                const data = await fetchJson('/api/internal-api/refresh', {method: 'POST'});
                renderStatus({syncStatus: data.syncStatus});
                renderMessage({
                    message: data.status === 'refreshed'
                        ? 'Dataset Internal API berhasil di-refresh.'
                        : 'Refresh selesai, tetapi sebagian sumber data belum siap.',
                    recordCount: data.syncStatus && data.syncStatus.financialData
                        ? data.syncStatus.financialData.recordCount
                        : 0,
                }, data.status === 'refreshed' ? 'success' : 'active');
            } catch (error) {
                renderMessage({message: error.message, recordCount: 0}, 'error');
                try {
                    await loadStatus();
                } catch (_) {
                    ui.btnRefreshInternalApi.disabled = true;
                }
            }
        }

        ui.btnRefreshInternalApi.onclick = refreshInternalApiDataset;

        loadStatus().catch(error => {
            ui.status.innerHTML = `<span style="color:#991b1b;font-weight:800;">${escapeHtml(error.message)}</span>`;
            ui.btnRefreshInternalApi.disabled = true;
            ui.btnSave.textContent = 'Internal API Belum Aktif';
        });
    </script>
</body>
</html>
